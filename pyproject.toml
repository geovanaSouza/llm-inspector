[build-system]
requires = ["setuptools>=61.0"]

[project]
name = "llm-inspector"
version = "0.1.0"
description = "Prompt Telemetry Engine - An LLM mechanic inspector"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=15.0.0",
    "tiktoken>=0.14.0",
    "numpy>=2.5.4",
    "sentence-transformers>=6.2.0",
    "transformers>=5.22.1"
]

[project.scripts]
llm-inspector = "main:main"